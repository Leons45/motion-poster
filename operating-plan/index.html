<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Studio – Leon's 2027 Operating Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kaushan+Script&family=Montserrat:wght@500;700;800;900&family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f10;--panel:#18181a;--panel2:#202023;--line:#2e2e32;--txt:#ececec;--mut:#9a9aa2;--y:#FBD90C;--blue:#4da3ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  #app{display:grid;grid-template-rows:54px minmax(0,1fr);grid-template-columns:410px minmax(0,1fr);height:100vh}

  /* ---------- top bar ---------- */
  #top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.01em}
  .brand i{width:34px;height:20px;border-radius:50%;background:var(--y);display:block}
  #pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 9px;width:300px;font-weight:600}
  #pname:hover,#pname:focus{border-color:var(--line);outline:none;background:var(--panel2)}
  .sp{flex:1}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#4a4a50}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--y);color:#000;border-color:var(--y);font-weight:800}
  .btn.sm{padding:4px 8px;font-size:12px;border-radius:7px}
  .btn.ic{padding:7px 10px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.danger:hover{border-color:#e5484d;color:#ff8a8d}
  #saved{color:var(--mut);font-size:12px;min-width:70px;text-align:right}
  .zoom{display:flex;align-items:center;gap:4px}
  #zoomLbl{min-width:44px;text-align:center;color:var(--mut)}

  /* ---------- sidebar ---------- */
  #side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;color:var(--mut);cursor:pointer;font-weight:700}
  #tabs button.on{color:var(--txt);border-bottom-color:var(--y)}
  #panel{flex:1;min-height:0;overflow:auto;padding:12px 14px 40px}
  details{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--panel2)}
  summary{cursor:pointer;padding:11px 13px;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--y);transition:.15s}
  details[open]>summary::before{transform:rotate(90deg)}
  .body{padding:2px 13px 13px;display:grid;gap:10px}
  .f{display:grid;gap:5px}
  .f>span,.lbl{color:var(--mut);font-size:12px;font-weight:600}
  .f.row{grid-template-columns:1fr auto;align-items:center}
  input[type=text],input[type=number],select,textarea{width:100%;background:#111113;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  input:focus,select:focus,textarea:focus{outline:2px solid #fbd90c55;border-color:var(--y)}
  textarea{resize:vertical;min-height:62px}
  .num{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:8px}
  .num>span{color:var(--mut);font-size:12px;font-weight:600}
  .num input[type=number]{padding:5px 6px}
  input[type=range]{width:100%;accent-color:var(--y)}
  .colors{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .col{display:grid;gap:4px}
  .col>span{color:var(--mut);font-size:12px;font-weight:600}
  .col div{display:flex;gap:6px}
  input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);background:#111113;border-radius:8px;cursor:pointer}
  .hex{font-family:ui-monospace,monospace;text-transform:uppercase}
  .chk{display:flex;align-items:center;gap:8px;cursor:pointer}
  .chk input{accent-color:var(--y);width:16px;height:16px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .hint{color:var(--mut);font-size:12px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pre{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px;cursor:pointer;text-align:left}
  .pre:hover{border-color:var(--y)}
  .pre .sw{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:6px}
  .pre .sw b{flex:1}
  .pre span{font-size:12px;font-weight:700}

  .hlist{display:grid;gap:4px;max-height:260px;overflow:auto}
  .hist{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;text-align:left;background:#111113;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
  .hist:hover{border-color:#55555c}
  .hist b{color:var(--mut);font-weight:700}
  .hist em{font-style:normal;font-size:11px;color:var(--mut)}
  .hist.on{border-color:var(--y);background:#1e1c08}.hist.on em{color:var(--y)}
  .hist.fut{opacity:.5}
  /* initiative list */
  .item{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;overflow:hidden}
  .item.on{border-color:var(--y)}
  .item.dragover{border-color:var(--blue)}
  .ih{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;cursor:pointer}
  .ih .n{width:26px;height:26px;border-radius:50%;background:var(--y);color:#000;font-weight:900;font-size:12px;display:grid;place-items:center;flex:none}
  .ih .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .item.off .t{opacity:.4;text-decoration:line-through}
  .grip{cursor:grab;color:var(--mut);padding:0 2px;user-select:none}
  .ib{padding:3px 6px;font-size:12px}
  .ibody{padding:4px 12px 12px;display:grid;gap:10px;border-top:1px solid var(--line)}
  .icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .icons button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#111113;cursor:pointer;display:grid;place-items:center;padding:5px}
  .icons button.on{background:var(--y);border-color:var(--y)}
  .icons button svg{width:100%;height:100%}

  /* ---------- workspace ---------- */
  #work{overflow:auto;position:relative;min-width:0;
    background-color:#161618;background-image:linear-gradient(45deg,#1b1b1e 25%,transparent 25%,transparent 75%,#1b1b1e 75%),linear-gradient(45deg,#1b1b1e 25%,transparent 25%,transparent 75%,#1b1b1e 75%);background-size:24px 24px;background-position:0 0,12px 12px}
  #stageWrap{position:relative;box-shadow:0 20px 70px rgba(0,0,0,.6)}
  #stage{position:absolute;left:0;top:0}
  #poster{position:absolute;left:0;top:0;overflow:hidden;font-family:var(--ff)}
  #poster .ed{outline:none;cursor:text}
  #poster .ed:hover{box-shadow:0 0 0 4px rgba(77,163,255,.45);border-radius:6px}
  #poster .ed:focus{box-shadow:0 0 0 5px rgba(77,163,255,.9);border-radius:6px}
  #poster .is-sel{outline:6px dashed var(--blue);outline-offset:10px}
  #poster .layer{cursor:move;touch-action:none}
  #poster .layer .ed{cursor:inherit}
  #poster .rh{position:absolute;right:-18px;bottom:-18px;width:36px;height:36px;border-radius:50%;background:var(--blue);border:5px solid #fff;cursor:nwse-resize;display:none}
  #poster .layer.is-sel .rh{display:block}
  #poster .card,#poster .hdr{cursor:default}
  #tt{position:fixed;z-index:45;display:flex;align-items:center;gap:6px;background:#fff;color:#111;border-radius:12px;padding:6px 8px;box-shadow:0 10px 40px rgba(0,0,0,.55);font-weight:700;font-size:12.5px;white-space:nowrap}
  #tt[hidden]{display:none}
  #tt #ttName{padding:0 4px;color:#555}
  #tt .sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.25);cursor:pointer;padding:0;margin-right:2px}
  #tt .sw:hover{transform:scale(1.15)}
  #tt button:not(.sw){border:1px solid #ccc;background:#f4f4f4;border-radius:7px;padding:3px 8px;cursor:pointer;font-weight:800}
  #tt input[type=color]{width:30px;height:26px;padding:0;border:1px solid #ccc;border-radius:6px;background:none;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#111113;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--mut)}
  .chip.on{background:var(--y);color:#000;border-color:var(--y);font-weight:700}
  .icons{max-height:236px;overflow:auto;padding:2px}
  details.sub{background:#151517;margin:0}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast.on{opacity:1;transform:translateX(-50%)}
  #exporting{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:60;font-weight:800;font-size:18px}
  #exporting.on{display:grid}
  .kbd{font-family:ui-monospace,monospace;background:#111113;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
</style>
<style id="printCSS"></style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><i></i>Poster Studio</div>
    <input id="pname" type="text" spellcheck="false" title="Project name">
    <span class="sp"></span>
    <span id="saved">Saved</span>
    <button class="btn" id="undo" data-act="undo" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
    <button class="btn" id="redo" data-act="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
    <div class="zoom">
      <button class="btn ic" data-act="zoom-out" title="Zoom out">−</button>
      <span id="zoomLbl">100%</span>
      <button class="btn ic" data-act="zoom-in" title="Zoom in">+</button>
      <button class="btn" data-act="zoom-fit">Fit</button>
    </div>
    <button class="btn pri" data-act="export-png">Download PNG</button>
    <button class="btn" data-act="export-pdf">Print / PDF</button>
  </div>

  <aside id="side">
    <div id="tabs">
      <button data-tab="content">Content</button>
      <button data-tab="style">Style</button>
      <button data-tab="layout">Layout</button>
      <button data-tab="layers">Layers</button>
      <button data-tab="export">File</button>
    </div>
    <div id="panel"></div>
  </aside>

  <main id="work"><div id="stageWrap"><div id="stage"><div id="poster"></div></div></div></main>
</div>
<div id="toast"></div>
<div id="tt" hidden>
  <span id="ttName"></span><span id="ttSw"></span>
  <input type="color" id="ttColor" title="Pick any colour">
  <button data-tt="smaller" title="Smaller text">A−</button><button data-tt="bigger" title="Bigger text">A+</button><button data-tt="reset" title="Reset this text's colour and size">Reset</button>
</div>
<div id="exporting">Rendering your poster…</div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
/* html2canvas is bundled in /vendor; fall back to the CDN if it is missing */
(function(){var s=document.createElement('script');s.src='vendor/html2canvas.min.js';
  s.onerror=function(){var c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.appendChild(c)};
  document.head.appendChild(s)})();
</script>

    const base=parseFloat(el.style.fontSize);let s=base;el.style.fontSize=base+'px';

  });

/* Card text auto-fit (display only – your sizes stay as set).
   One shared factor for all cards so they stay consistent: it shrinks text that overflows and,
   if "enlarge" is on, grows text/icons to use tall cards (e.g. in a 30 / 70 split). */
function fitCards(){
  const g=S.grid,cards=$$('#poster .card');if(!cards.length)return;
  const apply=f=>{
    const ig=f>1?Math.min(f,1.5):1;
    cards.forEach(c=>{
      const h=$('h3',c),p=$('p',c),icn=$('.icn',c);
      h.style.fontSize=g.titleSize*(+h.dataset.s||1)*f+'px';
      p.style.fontSize=g.descSize*(+p.dataset.s||1)*f+'px';
      if(icn){
        const sz=parseFloat(icn.dataset.sz)*ig,gp=sz*parseFloat(icn.dataset.gl);
        icn.style.width=icn.style.height=sz+'px';
        const sv=$('svg',icn),im=$('img',icn),sp=$('.ig',icn);
        if(sv){sv.setAttribute('width',gp);sv.setAttribute('height',gp)}
        if(im){im.style.width=im.style.height=gp+'px'}
        if(sp)sp.style.fontSize=gp*.82+'px';
      }
    });
  };
  const fits=k=>cards.every(c=>{
    const txt=$('.txt',c),icn=$('.icn',c),cs=getComputedStyle(c);
    const pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+(parseFloat(cs.borderBottomWidth)||0)*2;
    const stack=g.layout==='stack',gap=parseFloat(cs.rowGap)||0;
    const need=Math.max(txt.offsetHeight,!stack&&icn?icn.offsetHeight:0)+(stack&&icn?icn.offsetHeight+gap:0);
    return need<=(c.clientHeight-pad)*k;
  });
  apply(1);
  if(g.autoGrow){
    let f=1.8,n=0;apply(f);
    while(!fits(.86)&&f>1&&n++<60){f*=.97;apply(f)}
    if(f<=1)apply(1);
  }
  if(g.autoShrink&&!fits(1)){
    let f=1,n=0;
    while(!fits(1)&&f>.45&&n++<60){f*=.96;apply(f)}
  }
  /* long custom badge text (e.g. "Q1") shrinks to fit the badge */
  $$('#poster .bnum').forEach(el=>{
    const box=el.parentElement;let fs=parseFloat(el.dataset.fs),n=0;el.style.fontSize=fs+'px';
    while(el.scrollWidth>box.clientWidth-26&&fs>12&&n++<30){fs*=.92;el.style.fontSize=fs+'px'}
  });
}

function autoFit(k,old,oldRatio){

function readURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function fileToAsset(f){
  let url=await readURL(f);
  if(f.type!=='image/svg+xml'){
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=2800;
    if(Math.max(im.naturalWidth,im.naturalHeight)>max){
      const k=max/Math.max(im.naturalWidth,im.naturalHeight),c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      url=c.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.92);
    }
  }
  const id=uid();ASSETS[id]=url;return 'asset:'+id;
}

const TT_NAMES={title:'Card title',desc:'Card text',num:'Number',tagline:'Tagline',big:'Big text',line1:'Headline',line2:'Headline',text:'Text layer'};
const TT_SWATCHES=['#FBD90C','#000000','#FFFFFF','#E31B23','#D9D9D9'];
let ttPath=null;
const ttKind=path=>{const m=path.match(/^(?:cards\.\d+|header|layers\.\d+)\.(\w+)$/);return m?m[1]:''};
function ttColorOf(path){
  let m;
  if(m=path.match(/^cards\.(\d+)\.(title|desc|num)$/)){const i=+m[1],ec=cardColors(i,visIdx(i),S.grid.cols);return effHex(ec[m[2]==='num'?'badgeText':m[2]])}

function showTT(path){

  $('#ttSw').innerHTML=TT_SWATCHES.map(c=>`<button class="sw" data-tt="color" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('');

function positionTT(){

function ttApply(o){
  const path=ttPath;if(!path)return;
  const ae=document.activeElement,wasEditing=!!(ae&&ae.dataset&&ae.dataset.bind===path);
  let m;
  if(m=path.match(/^cards\.(\d+)\.(title|desc|num)$/)){
    const c=S.cards[+m[1]],f=m[2],ck=f==='num'?'badgeText':f;c.c=c.c||{};c.ov=c.ov||{};
    if(o.color)c.c[ck]=o.color;
    if(o.mul){const x=c.ov[f]=c.ov[f]||{};x.scale=clamp((x.scale||1)*o.mul,.3,3)}
    if(o.reset){delete c.c[ck];delete c.ov[f]}
  }else if(m=path.match(/^header\.(tagline|big|line1|line2)$/)){
    const h=S.header;h.ov=h.ov||{};const x=h.ov[m[1]]=h.ov[m[1]]||{};
    if(o.color)x.color=o.color;if(o.mul)x.scale=clamp((x.scale||1)*o.mul,.3,3);if(o.reset)delete h.ov[m[1]];
  }else if(m=path.match(/^layers\.(\d+)\.text$/)){
    const L=S.layers[+m[1]];if(!L)return;if(o.color)L.color=o.color;if(o.mul)L.size=Math.max(8,Math.round(L.size*o.mul));
  }
  note(o.color?'Change text colour':o.reset?'Reset text style':'Change text size');
  renderPoster();$('#ttColor').value=ttColorOf(path);
  if(wasEditing){const n=$(`#poster [data-bind="${path}"]`);if(n){n.focus();const r=document.createRange();r.selectNodeContents(n);r.collapse(false);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}}
  renderSidebar();commitSoon();saveSoon();
}
$('#tt').addEventListener('mousedown',e=>{if(!e.target.closest('input'))e.preventDefault()});
$('#tt').addEventListener('click',e=>{
  const b=e.target.closest('[data-tt]');if(!b)return;const a=b.dataset.tt;
  if(a==='color')ttApply({color:b.dataset.c});else if(a==='bigger')ttApply({mul:1.1});else if(a==='smaller')ttApply({mul:1/1.1});else if(a==='reset')ttApply({reset:true});
});
$('#ttColor').addEventListener('input',e=>ttApply({color:e.target.value.toUpperCase()}));
document.addEventListener('pointerdown',e=>{if(!ttPath)return;if(e.target.closest('#tt')||e.target.closest('#poster [data-bind]'))return;hideTT()},true);
$('#work').addEventListener('scroll',positionTT);

/* ---------- poster: inline text editing, selection, layer drag/resize ---------- */
const poster=$('#poster');
poster.addEventListener('input',e=>{
  const el=e.target.closest('[data-bind]');if(!el)return;
  const path=el.dataset.bind,val=el.dataset.multi?el.innerText.replace(/\n$/,''):el.textContent;
  set(path,val);note(labelFor(path).replace(/^Edit$/,'Edit text'));
  $$(`#panel [data-k="${path}"]`).forEach(o=>{if(o!==document.activeElement)o.value=val});
  if(/^cards\.\d+\.title$/.test(path)){const it=$$('#panel .item')[path.split('.')[1]];const t=it&&$('.t',it);if(t)t.textContent=val||'(untitled)'}
  fitText();if(/^cards\./.test(path)){const c=el.closest('.card');if(c){const h=$('h3',c),p=$('p',c);h.style.fontSize=S.grid.titleSize+'px';p.style.fontSize=S.grid.descSize+'px'}fitCards()}commitSoon();saveSoon();
});
poster.addEventListener('keydown',e=>{
  const el=e.target.closest('[data-bind]');if(!el)return;
  if(e.key==='Enter'&&!el.dataset.multi){e.preventDefault();el.blur()}
  if(e.key==='Escape'){el.blur();hideTT()}
  e.stopPropagation();
});
poster.addEventListener('paste',e=>{const el=e.target.closest('[data-bind]');if(!el)return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
poster.addEventListener('focusin',e=>{
  const s=e.target.closest('[data-sel]');if(s)selectFrom(s.dataset.sel,false);
  const b=e.target.closest('[data-bind]');if(b)showTT(b.dataset.bind);
});
poster.addEventListener('dblclick',e=>{
  const ed=e.target.closest('.layer .ed');if(!ed)return;
  ed.setAttribute('contenteditable','true');ed.focus();
  const r=document.createRange();r.selectNodeContents(ed);const s=getSelection();s.removeAllRanges();s.addRange(r);
  ed.addEventListener('blur',()=>ed.removeAttribute('contenteditable'),{once:true});
});
function selectFrom(v,render=true){
  const [t,x]=v.split(':');
  if(t==='card'){sel={t:'card',i:+x};openCard=+x;tab='content'}
  else if(t==='header'){sel={t:'header'};tab='content';openCard=-1}
  else if(t==='layer'){sel={t:'layer',id:x};tab='layers'}
  renderSidebar();applySel();
  if(t==='card'){const it=$$('#panel .item')[+x];if(it)it.scrollIntoView({block:'nearest'})}
}
let drag=null;
poster.addEventListener('pointerdown',e=>{
  const lay=e.target.closest('.layer');
  if(lay&&!(e.target.closest('.ed')&&e.target.closest('.ed').isContentEditable)){
    selectFrom('layer:'+lay.dataset.layer);
    const L=S.layers.find(l=>l.id===lay.dataset.layer);if(!L)return;
    drag={mode:e.target.closest('.rh')?'resize':'move',id:L.id,x:e.clientX,y:e.clientY,lx:L.x,ly:L.y,lw:L.w,lh:L.h,el:lay};
    e.preventDefault();return;
  }
  const s=e.target.closest('[data-sel]');
  if(s){if(!e.target.closest('.ed'))selectFrom(s.dataset.sel)}
  else if(!e.target.closest('.ed')){sel=null;applySel();renderSidebar()}
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;const L=S.layers.find(l=>l.id===drag.id);if(!L)return;
  const k=view.s||1,dx=(e.clientX-drag.x)/k,dy=(e.clientY-drag.y)/k;
  if(drag.mode==='move'){L.x=Math.round(drag.lx+dx);L.y=Math.round(drag.ly+dy);drag.el.style.left=L.x+'px';drag.el.style.top=L.y+'px'}
  else{L.w=Math.max(20,Math.round(drag.lw+dx));drag.el.style.width=L.w+'px';if(L.type==='shape'){L.h=Math.max(10,Math.round(drag.lh+dy));drag.el.style.height=L.h+'px'}}
});
let drag0='move';
window.addEventListener('pointerup',()=>{
  if(!drag)return;const L=S.layers.find(l=>l.id===drag.id);drag0=drag.mode;drag=null;
  if(L){note(drag0==='resize'?'Resize layer':'Move layer');['x','y','w','h'].forEach(p=>$$(`#panel [data-k="layers.${S.layers.indexOf(L)}.${p}"]`).forEach(o=>o.value=L[p]));commitSoon();saveSoon()}
});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement,mod=e.metaKey||e.ctrlKey,typing=/INPUT|TEXTAREA|SELECT/.test(ae.tagName)||ae.isContentEditable;
  /* while typing in a text box the browser's own character-level undo applies; everywhere else (sliders, dropdowns, the poster, buttons) it is the app's undo */
  const textual=ae.isContentEditable||ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&!['range','checkbox','color','button','file'].includes(ae.type));
  if(mod&&e.key.toLowerCase()==='z'&&!textual){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!textual){e.preventDefault();redo();return}
  if(typing||!sel||sel.t!=='layer')return;
  const L=S.layers.find(l=>l.id===sel.id);if(!L)return;
  const st=e.shiftKey?10:1;let used=true;
  if(e.key==='ArrowLeft')L.x-=st;else if(e.key==='ArrowRight')L.x+=st;else if(e.key==='ArrowUp')L.y-=st;else if(e.key==='ArrowDown')L.y+=st;
  else if(e.key==='Delete'||e.key==='Backspace'){S.layers=S.layers.filter(l=>l.id!==L.id);sel=null;renderSidebar()}
  else used=false;
  if(used){e.preventDefault();change()}
});
window.addEventListener('resize',()=>{fitView();placeLeaf()});
if(window.ResizeObserver)new ResizeObserver(()=>{if(view.zoom==='fit'){fitView();placeLeaf()}}).observe($('#work'));
document.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey)||!e.target.closest('#work'))return;e.preventDefault();view.zoom=clamp((view.s||1)*(e.deltaY<0?1.1:1/1.1),.05,3);fitView();placeLeaf()},{passive:false});

/* =====================================================================
   PNG EXPORT  (renders an off-screen, un-scaled copy so the result is exact)
   ===================================================================== */
async function exportPNG(){
  if(!window.html2canvas){toast('PNG engine still loading – try again in a second');return}
  const ov=$('#exporting');ov.classList.add('on');
  await new Promise(r=>setTimeout(r,60));
  const b=bleedPx(),tw=DW+2*b,th=DH()+2*b;
  const wIn=S.canvas.wIn+2*S.canvas.bleed;
  let outW=parseInt(($('#outW')||{}).value)||Math.round(wIn*150);outW=clamp(outW,300,9000);
  const host=document.createElement('div');
  host.style.cssText=`position:fixed;left:0;top:0;width:${tw}px;height:${th}px;z-index:-1;pointer-events:none`;
  const clone=poster.cloneNode(true);
  clone.removeAttribute('id');clone.style.cssText=poster.style.cssText+`;position:absolute;left:0;top:0;width:${tw}px;height:${th}px`;
  $$('.is-sel',clone).forEach(x=>x.classList.remove('is-sel'));
  $$('.guides,.rh',clone).forEach(x=>x.remove());
  $$('.ed',clone).forEach(x=>{x.removeAttribute('contenteditable');x.style.boxShadow='none'});
  host.appendChild(clone);document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(clone,{scale:outW/tw,backgroundColor:null,useCORS:true,logging:false,width:tw,height:th,windowWidth:tw,windowHeight:th,scrollX:0,scrollY:0});
    await new Promise(res=>cv.toBlob(bl=>{dl(bl,`${slug()}-${cv.width}x${cv.height}.png`);res()},'image/png'));
    toast(`PNG saved (${cv.width} × ${cv.height} px)`);
  }catch(err){console.error(err);toast('Export failed – try a smaller output width')}
  finally{host.remove();ov.classList.remove('on')}
}

/* =====================================================================
   BOOT
   ===================================================================== */
load();
commit();
fullRender();
$('#saved').textContent='Saved';
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderPoster()});
window.__studio={ICONS,iconSVG,get S(){return S},get sel(){return sel},exportPNG,undo,redo,commit};
})();

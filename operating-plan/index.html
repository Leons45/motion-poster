<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Studio – Leon's 2027 Operating Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kaushan+Script&family=Montserrat:wght@500;700;800;900&family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f10;--panel:#18181a;--panel2:#202023;--line:#2e2e32;--txt:#ececec;--mut:#9a9aa2;--y:#FBD90C;--blue:#4da3ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  #app{display:grid;grid-template-rows:54px minmax(0,1fr);grid-template-columns:410px minmax(0,1fr);height:100vh}

  /* ---------- top bar ---------- */
  #top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.01em}
  .brand i{width:34px;height:20px;border-radius:50%;background:var(--y);display:block}
  #pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 9px;width:300px;font-weight:600}
  #pname:hover,#pname:focus{border-color:var(--line);outline:none;background:var(--panel2)}
  .sp{flex:1}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#4a4a50}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--y);color:#000;border-color:var(--y);font-weight:800}
  .btn.sm{padding:4px 8px;font-size:12px;border-radius:7px}
  .btn.ic{padding:7px 10px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.danger:hover{border-color:#e5484d;color:#ff8a8d}
  #saved{color:var(--mut);font-size:12px;min-width:70px;text-align:right}
  .zoom{display:flex;align-items:center;gap:4px}
  #zoomLbl{min-width:44px;text-align:center;color:var(--mut)}

  /* ---------- sidebar ---------- */
  #side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;color:var(--mut);cursor:pointer;font-weight:700}
  #tabs button.on{color:var(--txt);border-bottom-color:var(--y)}
  #panel{flex:1;min-height:0;overflow:auto;padding:12px 14px 40px}
  details{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--panel2)}
  summary{cursor:pointer;padding:11px 13px;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--y);transition:.15s}
  details[open]>summary::before{transform:rotate(90deg)}
  .body{padding:2px 13px 13px;display:grid;gap:10px}
  .f{display:grid;gap:5px}
  .f>span,.lbl{color:var(--mut);font-size:12px;font-weight:600}
  .f.row{grid-template-columns:1fr auto;align-items:center}
  input[type=text],input[type=number],select,textarea{width:100%;background:#111113;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  input:focus,select:focus,textarea:focus{outline:2px solid #fbd90c55;border-color:var(--y)}
  textarea{resize:vertical;min-height:62px}
  .num{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:8px}
  .num>span{color:var(--mut);font-size:12px;font-weight:600}
  .num input[type=number]{padding:5px 6px}
  input[type=range]{width:100%;accent-color:var(--y)}
  .colors{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .col{display:grid;gap:4px}
  .col>span{color:var(--mut);font-size:12px;font-weight:600}
  .col div{display:flex;gap:6px}
  input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);background:#111113;border-radius:8px;cursor:pointer}
  .hex{font-family:ui-monospace,monospace;text-transform:uppercase}
  .chk{display:flex;align-items:center;gap:8px;cursor:pointer}
  .chk input{accent-color:var(--y);width:16px;height:16px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .hint{color:var(--mut);font-size:12px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pre{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px;cursor:pointer;text-align:left}
  .pre:hover{border-color:var(--y)}
  .pre .sw{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:6px}
  .pre .sw b{flex:1}
  .pre span{font-size:12px;font-weight:700}

  /* initiative list */
  .item{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;overflow:hidden}
  .item.on{border-color:var(--y)}
  .item.dragover{border-color:var(--blue)}
  .ih{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;cursor:pointer}
  .ih .n{width:26px;height:26px;border-radius:50%;background:var(--y);color:#000;font-weight:900;font-size:12px;display:grid;place-items:center;flex:none}
  .ih .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .item.off .t{opacity:.4;text-decoration:line-through}
  .grip{cursor:grab;color:var(--mut);padding:0 2px;user-select:none}
  .ib{padding:3px 6px;font-size:12px}
  .ibody{padding:4px 12px 12px;display:grid;gap:10px;border-top:1px solid var(--line)}
  .icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .icons button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#111113;cursor:pointer;display:grid;place-items:center;padding:5px}
  .icons button.on{background:var(--y);border-color:var(--y)}
  .icons button svg{width:100%;height:100%}

  /* ---------- workspace ---------- */
  #work{overflow:auto;position:relative;min-width:0;
    background-color:#161618;background-image:linear-gradient(45deg,#1b1b1e 25%,transparent 25%,transparent 75%,#1b1b1e 75%),linear-gradient(45deg,#1b1b1e 25%,transparent 25%,transparent 75%,#1b1b1e 75%);background-size:24px 24px;background-position:0 0,12px 12px}
  #stageWrap{position:relative;box-shadow:0 20px 70px rgba(0,0,0,.6)}
  #stage{position:absolute;left:0;top:0}
  #poster{position:absolute;left:0;top:0;overflow:hidden;font-family:var(--ff)}
  #poster .ed{outline:none;cursor:text}
  #poster .ed:hover{box-shadow:0 0 0 4px rgba(77,163,255,.45);border-radius:6px}
  #poster .ed:focus{box-shadow:0 0 0 5px rgba(77,163,255,.9);border-radius:6px}
  #poster .is-sel{outline:6px dashed var(--blue);outline-offset:10px}
  #poster .layer{cursor:move;touch-action:none}
  #poster .layer .ed{cursor:inherit}
  #poster .rh{position:absolute;right:-18px;bottom:-18px;width:36px;height:36px;border-radius:50%;background:var(--blue);border:5px solid #fff;cursor:nwse-resize;display:none}
  #poster .layer.is-sel .rh{display:block}
  #poster .card,#poster .hdr{cursor:default}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast.on{opacity:1;transform:translateX(-50%)}
  #exporting{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:60;font-weight:800;font-size:18px}
  #exporting.on{display:grid}
  .kbd{font-family:ui-monospace,monospace;background:#111113;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
</style>
<style id="printCSS"></style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><i></i>Poster Studio</div>
    <input id="pname" type="text" spellcheck="false" title="Project name">
    <span class="sp"></span>
    <span id="saved">Saved</span>
    <button class="btn ic" id="undo" data-act="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn ic" id="redo" data-act="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <div class="zoom">
      <button class="btn ic" data-act="zoom-out" title="Zoom out">−</button>
      <span id="zoomLbl">100%</span>
      <button class="btn ic" data-act="zoom-in" title="Zoom in">+</button>
      <button class="btn" data-act="zoom-fit">Fit</button>
    </div>
    <button class="btn pri" data-act="export-png">Download PNG</button>
    <button class="btn" data-act="export-pdf">Print / PDF</button>
  </div>

  <aside id="side">
    <div id="tabs">
      <button data-tab="content">Content</button>
      <button data-tab="style">Style</button>
      <button data-tab="layout">Layout</button>
      <button data-tab="layers">Layers</button>
      <button data-tab="export">File</button>
    </div>
    <div id="panel"></div>
  </aside>

  <main id="work"><div id="stageWrap"><div id="stage"><div id="poster"></div></div></div></main>
</div>
<div id="toast"></div>
<div id="exporting">Rendering your poster…</div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
/* html2canvas is bundled in /vendor; fall back to the CDN if it is missing */
(function(){var s=document.createElement('script');s.src='vendor/html2canvas.min.js';
  s.onerror=function(){var c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.appendChild(c)};
  document.head.appendChild(s)})();
</script>
<script>
(()=>{'use strict';
/* =====================================================================
   POSTER STUDIO – everything is driven by one state object (S).
   The poster is rebuilt from S on every change; the sidebar edits S.
   Design space is 2112 px wide (= 22 in @ 96 dpi); export scales from it.
   ===================================================================== */
const DW = 2112, LS = 'leons-poster-studio-v1';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------------- icon library (all stroke-drawn, explicit colours so PNG export is safe) ---------------- */
const ICONS = {
  inventory:'<path d="M16 52 L44 38 L72 52 L72 82 L44 96 L16 82 Z"/><path d="M16 52 L44 66 L72 52"/><path d="M44 66 V96"/><path d="M58 18 H84 V44"/><path d="M84 18 L56 46"/>',
  price:'<path d="M14 54 L52 14 H88 V50 L50 88 Z"/><circle cx="72" cy="30" r="6"/><text x="50" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="40" fill="{c}" stroke="none">$</text>',
  pin:'<path d="M50 94 C50 94 18 62 18 40 A32 32 0 0 1 82 40 C82 62 50 94 50 94 Z"/><circle cx="50" cy="40" r="12"/><path d="M26 96 H74"/>',
  store:'<path d="M10 40 L18 12 H82 L90 40 Z"/><path d="M10 40 Q20 54 30 40 Q40 54 50 40 Q60 54 70 40 Q80 54 90 40"/><path d="M18 50 V90 H82 V50"/><path d="M40 90 V66 H60 V90"/>',
  basket:'<path d="M10 40 H90 L80 86 H20 Z"/><path d="M28 40 L42 14"/><path d="M72 40 L58 14"/><path d="M38 54 V72"/><path d="M50 54 V72"/><path d="M62 54 V72"/>',
  newstore:'<path d="M8 52 L14 30 H54 L60 52 Z"/><path d="M14 52 V88 H54 V52"/><path d="M28 88 V68 H40 V88"/><circle cx="74" cy="30" r="17"/><path d="M74 21 V39 M65 30 H83"/>',
  truck:'<path d="M8 28 H58 V68 H8 Z"/><path d="M58 40 H80 L92 54 V68 H58"/><circle cx="26" cy="74" r="9"/><circle cx="76" cy="74" r="9"/>',
  star:'<path d="M50 10 L61 38 L92 40 L68 59 L76 90 L50 73 L24 90 L32 59 L8 40 L39 38 Z"/>',
  heart:'<path d="M50 88 C20 66 10 48 10 34 A20 20 0 0 1 50 28 A20 20 0 0 1 90 34 C90 48 80 66 50 88 Z"/>',
  target:'<circle cx="50" cy="50" r="38"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="6"/>',
  chart:'<path d="M12 88 H92"/><path d="M24 76 V54"/><path d="M44 76 V38"/><path d="M64 76 V58"/><path d="M84 76 V22"/>',
  people:'<circle cx="36" cy="34" r="14"/><path d="M10 88 C10 66 22 58 36 58 C50 58 62 66 62 88"/><circle cx="72" cy="38" r="11"/><path d="M68 60 C84 60 92 70 92 88"/>',
  percent:'<circle cx="30" cy="30" r="12"/><circle cx="70" cy="70" r="12"/><path d="M80 20 L20 80"/>',
  sofa:'<path d="M18 44 V32 A10 10 0 0 1 28 22 H72 A10 10 0 0 1 82 32 V44"/><path d="M8 54 A10 10 0 0 1 18 44 A10 10 0 0 1 28 54 V62 H72 V54 A10 10 0 0 1 82 44 A10 10 0 0 1 92 54 V74 H8 Z"/><path d="M18 74 V84 M82 74 V84"/>',
  bed:'<path d="M10 30 V86"/><path d="M10 68 H90 V86"/><path d="M10 68 V52 H90 V68"/><path d="M22 52 V40 H44 V52"/>',
  home:'<path d="M10 48 L50 14 L90 48"/><path d="M20 42 V86 H80 V42"/><path d="M42 86 V60 H58 V86"/>',
  key:'<circle cx="32" cy="50" r="18"/><path d="M50 50 H90"/><path d="M76 50 V64"/><path d="M64 50 V60"/>',
  gift:'<path d="M12 40 H88 V58 H12 Z"/><path d="M18 58 V88 H82 V58"/><path d="M50 40 V88"/><path d="M50 40 C34 40 28 18 40 18 C50 18 50 40 50 40 C50 40 50 18 60 18 C72 18 66 40 50 40"/>',
  clock:'<circle cx="50" cy="50" r="38"/><path d="M50 26 V50 L68 62"/>',
  check:'<circle cx="50" cy="50" r="38"/><path d="M30 52 L45 67 L72 36"/>',
  none:''
};
const iconSVG=(name,color,size)=>`<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" stroke="${color}" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">${(ICONS[name]||'').replace(/\{c\}/g,color)}</svg>`;

/* ---------------- defaults = the current Leon's poster ---------------- */
function defaults(){return{
  v:1, name:"Leon's 2027 Operating Plan – Initiatives",
  canvas:{wIn:22,hIn:28,bleed:0,autoFit:true},
  theme:{bg:'#000000',dome:'#FBD90C',accent:'#FBD90C',big:'#FFFFFF',hl:'#FBD90C',tag:'#FFFFFF',
         cardBg:'#000000',cardTitle:'#FFFFFF',cardDesc:'#D9D9D9',badgeBg:'#FBD90C',badgeText:'#000000',iconBg:'#FBD90C',iconFg:'#000000'},
  fonts:{family:'Proxima Soft',headW:900,bodyW:700,custom:[]},
  header:{align:'center',showLogo:true,logoSrc:'',logoW:600,logoTop:84,
          showTag:true,tagline:'That’s comfortable.',tagSize:56,tagGap:6,
          showBig:true,big:'2027',bigSize:600,bigGap:34,bigSpacing:-0.03,
          showHl:true,line1:'Operating Plan',line2:'Initiatives',hlSize:150,hlGap:20,hlUpper:true,hlLine:1.02},
  dome:{show:true,shape:'ellipse',dir:'up',top:1425,rx:2000,ry:1150},
  grid:{cols:2,top:1570,bottom:84,side:96,gapX:44,gapY:46,radius:60,style:'solid',alt:false,shadow:true,autoShrink:true,
        layout:'row',badge:'oval',badgeStart:1,badgePad:true,iconShape:'circle',iconSize:176,titleSize:52,descSize:31},
  cards:[
    {id:uid(),title:'Cleaning Up Our Aged Inventory',desc:'Liquidating all discontinued showroom & warehouse product',icon:'inventory',visible:true},
    {id:uid(),title:'Right Price, Right Customer',desc:'Building zone pricing processes to maximize sales & margin per market',icon:'price',visible:true},
    {id:uid(),title:'Win Back the GTA',desc:'Refocusing support for our biggest & most important trading area',icon:'pin',visible:true},
    {id:uid(),title:'Superstore & More',desc:'Prototyping a new one-stop-shop, total home retail experience',icon:'store',visible:true},
    {id:uid(),title:'Building Baskets Through Better Attachment',desc:'Redesigning & executing total home & room solution selling',icon:'basket',visible:true},
    {id:uid(),title:'Growing Our Store Footprint',desc:'Opening new stores in our biggest & best opportunity markets',icon:'newstore',visible:true}
  ],
  layers:[]
}}
const PRESETS={
  classic:{label:'Leon’s Classic',alt:false,t:{bg:'#000000',dome:'#FBD90C',accent:'#FBD90C',big:'#FFFFFF',hl:'#FBD90C',tag:'#FFFFFF',cardBg:'#000000',cardTitle:'#FFFFFF',cardDesc:'#D9D9D9',badgeBg:'#FBD90C',badgeText:'#000000',iconBg:'#FBD90C',iconFg:'#000000'}},
  checker:{label:'Checkerboard',alt:true,t:{bg:'#000000',dome:'#FBD90C',accent:'#FBD90C',big:'#FFFFFF',hl:'#FBD90C',tag:'#FFFFFF',cardBg:'#000000',cardTitle:'#FFFFFF',cardDesc:'#D9D9D9',badgeBg:'#FBD90C',badgeText:'#000000',iconBg:'#FBD90C',iconFg:'#000000'}},
  inverse:{label:'Yellow Top',alt:false,t:{bg:'#FBD90C',dome:'#000000',accent:'#FBD90C',big:'#000000',hl:'#000000',tag:'#000000',cardBg:'#FBD90C',cardTitle:'#000000',cardDesc:'#2b2b2b',badgeBg:'#000000',badgeText:'#FBD90C',iconBg:'#000000',iconFg:'#FBD90C'}},
  white:{label:'Clean White',alt:false,t:{bg:'#FFFFFF',dome:'#FBD90C',accent:'#FBD90C',big:'#000000',hl:'#000000',tag:'#000000',cardBg:'#000000',cardTitle:'#FFFFFF',cardDesc:'#D9D9D9',badgeBg:'#FBD90C',badgeText:'#000000',iconBg:'#FBD90C',iconFg:'#000000'}},
  midnight:{label:'Midnight Gold',alt:false,t:{bg:'#0B0B0D',dome:'#1A1A1E',accent:'#F5C518',big:'#FFFFFF',hl:'#F5C518',tag:'#CFCFCF',cardBg:'#2A2A30',cardTitle:'#FFFFFF',cardDesc:'#BDBDC4',badgeBg:'#F5C518',badgeText:'#000000',iconBg:'#F5C518',iconFg:'#000000'}},
  royal:{label:'Deep Blue',alt:false,t:{bg:'#0A1A3A',dome:'#FBD90C',accent:'#FBD90C',big:'#FFFFFF',hl:'#FBD90C',tag:'#DDE6FF',cardBg:'#0A1A3A',cardTitle:'#FFFFFF',cardDesc:'#C8D4F0',badgeBg:'#FBD90C',badgeText:'#0A1A3A',iconBg:'#FBD90C',iconFg:'#0A1A3A'}}
};
const CANVASES=[
  ['Poster 22 × 28 in',22,28],['Poster 24 × 36 in',24,36],['Poster 18 × 24 in',18,24],['Tabloid 11 × 17 in',11,17],
  ['Letter 8.5 × 11 in',8.5,11],['Social 4:5 (1080×1350)',10.8,13.5],['Square 1:1',12,12],['Story 9:16',9,16],['Landscape 16:9',16,9]
];
const BASE_FONTS=['Proxima Soft','Proxima Nova','Nunito','Poppins','Montserrat','Inter','Arial'];

/* ---------------- state, assets, history ---------------- */
let S=defaults(), ASSETS={}, HIST=[], HI=-1, sel=null, tab='content', openCard=-1;
let view={zoom:'fit',s:1}, guides=false, loadedFonts=new Set(), dragFrom=null;

const get=(p,o=S)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
const src=r=>r&&String(r).startsWith('asset:')?(ASSETS[String(r).slice(6)]||''):(r||'');
const DH=()=>DW*S.canvas.hIn/S.canvas.wIn;
const bleedPx=()=>S.canvas.bleed*DW/S.canvas.wIn;
const hexA=(h,a)=>{h=String(h).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function merge(d,s){if(Array.isArray(d)||typeof d!=='object'||d===null)return s===undefined?d:s;const o={...d};if(s&&typeof s==='object'&&!Array.isArray(s))for(const k in s)o[k]=(k in d)?merge(d[k],s[k]):s[k];return o}

function snap(){return JSON.stringify(S)}
let commitT=null;
function commitSoon(){clearTimeout(commitT);commitT=setTimeout(commit,350)}
function commit(){clearTimeout(commitT);const j=snap();if(HIST[HI]===j)return;HIST=HIST.slice(0,HI+1);HIST.push(j);if(HIST.length>80)HIST.shift();HI=HIST.length-1;updUndo()}
function restore(j){S=JSON.parse(j);sel=sel&&sel.t==='layer'&&!S.layers.find(l=>l.id===sel.id)?null:sel;fullRender()}
function undo(){commit();if(HI>0){HI--;restore(HIST[HI]);updUndo();saveSoon()}}
function redo(){if(HI<HIST.length-1){HI++;restore(HIST[HI]);updUndo();saveSoon()}}
function updUndo(){$('#undo').disabled=HI<=0;$('#redo').disabled=HI>=HIST.length-1}

let saveT=null;
function saveSoon(){$('#saved').textContent='Saving…';clearTimeout(saveT);saveT=setTimeout(save,500)}
function save(){try{localStorage.setItem(LS,JSON.stringify({state:S,assets:ASSETS}));$('#saved').textContent='Saved'}catch(e){$('#saved').textContent='Not saved';toast('Autosave is full (large images). Use File → Save project.')}}
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r&&r.state){S=merge(defaults(),r.state);S.cards=r.state.cards||S.cards;S.layers=r.state.layers||[];S.fonts.custom=(r.state.fonts&&r.state.fonts.custom)||[];ASSETS=r.assets||{}}}catch(e){}}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------------- fonts ---------------- */

function logoHTML(){

  const fs=w*.28;

    <div class="oval" style="position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:#FBD90C;border:${w*.0133}px solid #000;display:flex;align-items:center;justify-content:center">
      <span class="lt" style="font-family:'Kaushan Script','Brush Script MT',cursive;font-style:italic;font-weight:700;font-size:${fs}px;line-height:1;color:#000;white-space:nowrap;margin-top:${fs*.06}px">Leon<span class="apos" style="display:inline-block;width:${fs*.2}px"></span>s</span>
    </div>
    <img class="leaf" alt="" src="${LEAF_URI}" style="position:absolute;left:0;top:0;width:${w*.085}px;height:${w*.085}px;display:block">

function headerHTML(){
  const h=S.header,T=S.theme,F=S.fonts;

  if(h.showBig)s+=`<div class="ed fit" data-bind="header.big" contenteditable="true" spellcheck="false" style="margin:${h.bigGap}px 0 0;font-size:${h.bigSize}px;font-weight:${F.headW};line-height:.8;letter-spacing:${h.bigSpacing}em;color:${T.big};white-space:nowrap">${esc(h.big)}</div>`;
  if(h.showHl){
    const st=`font-size:${h.hlSize}px;font-weight:${F.headW};color:${T.hl};line-height:${h.hlLine};text-transform:${h.hlUpper?'uppercase':'none'};white-space:nowrap;display:inline-block`;

    if(h.line2!=='')s+=`<span class="ed fit" data-bind="header.line2" contenteditable="true" spellcheck="false" style="${st}">${esc(h.line2)}</span>`;
    s+='</div>';
  }
  return s+'</div>';
}
function cardColors(k,cols){
  const T=S.theme,g=S.grid;
  const alt=g.alt&&((Math.floor(k/cols)+k%cols)%2===1);
  let c={bg:T.cardBg,title:T.cardTitle,desc:T.cardDesc,badgeBg:T.badgeBg,badgeText:T.badgeText,ring:T.cardBg,iconBg:T.iconBg,iconFg:T.iconFg,border:'none',rule:false};
  if(alt)c={bg:T.accent,title:T.cardBg,desc:hexA(T.cardBg,.78),badgeBg:T.cardBg,badgeText:T.accent,ring:T.accent,iconBg:T.cardBg,iconFg:T.accent,border:'none',rule:false};
  if(g.style==='outline'||g.style==='minimal'){
    const ink=T.cardBg;
    c={bg:'transparent',title:ink,desc:hexA(ink,.82),badgeBg:ink,badgeText:T.dome,ring:T.dome,iconBg:ink,iconFg:T.dome,border:g.style==='outline'?`6px solid ${ink}`:'none',rule:g.style==='minimal'};
  }
  return c;
}
function cardHTML(c,i,k,cols){
  const g=S.grid,F=S.fonts,col=cardColors(k,cols);
  const stack=g.layout==='stack';
  const bw={oval:[150,96],circle:[108,108],pill:[150,66]}[g.badge];
  let badge='';
  if(bw){
    const n=g.badgeStart+k, txt=g.badgePad?String(n).padStart(2,'0'):String(n);
    badge=`<div class="badge" style="position:absolute;left:-26px;top:-30px;width:${bw[0]}px;height:${bw[1]}px;border-radius:${g.badge==='pill'?'999px':'50%'};background:${col.badgeBg};color:${col.badgeText};border:6px solid ${col.ring};display:flex;align-items:center;justify-content:center;font-size:${bw[1]*.6}px;font-weight:${F.headW};letter-spacing:-.02em;transform:rotate(-8deg);z-index:3">${txt}</div>`;
  }
  let icon='';
  if(c.icon&&c.icon!=='none'){
    const sz=g.iconSize;
    if(g.iconShape==='none')icon=`<div class="icn" style="flex:none;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center">${iconSVG(c.icon,col.iconBg==='transparent'?col.iconFg:col.iconBg,sz*.8)}</div>`;
    else icon=`<div class="icn" style="flex:none;width:${sz}px;height:${sz}px;border-radius:${g.iconShape==='rounded'?sz*.26:sz/2}px;background:${col.iconBg};display:flex;align-items:center;justify-content:center">${iconSVG(c.icon,col.iconFg,sz*.59)}</div>`;
  }
  const rule=col.rule?`border-bottom:5px solid ${col.title};border-radius:0;`:'';
  return `<article class="card" data-sel="card:${i}" style="position:relative;display:flex;flex-direction:${stack?'column':'row'};align-items:${stack?'flex-start':'center'};justify-content:${stack?'center':'flex-start'};gap:${stack?26:38}px;padding:${stack?'56px 44px 34px':'30px 44px 30px 46px'};border-radius:${g.radius}px;background:${col.bg};border:${col.border};${rule}color:${col.title};${g.shadow&&g.style==='solid'?'box-shadow:0 16px 0 rgba(0,0,0,.18);':''}">
    ${badge}${icon}
    <div class="txt" style="min-width:0">
      <h3 class="ed" data-bind="cards.${i}.title" contenteditable="true" spellcheck="false" style="margin:0 0 12px;font-size:${g.titleSize}px;line-height:1.04;font-weight:${F.headW};letter-spacing:-.01em;color:${col.title}">${esc(c.title)}</h3>
      <p class="ed" data-bind="cards.${i}.desc" contenteditable="true" spellcheck="false" style="margin:0;font-size:${g.descSize}px;line-height:1.24;font-weight:${F.bodyW};color:${col.desc}">${esc(c.desc)}</p>
    </div>
  </article>`;
}
function gridHTML(){
  const g=S.grid,vis=S.cards.map((c,i)=>({c,i})).filter(o=>o.c.visible!==false);
  if(!vis.length)return '';
  const rows=Math.ceil(vis.length/g.cols);
  let s=`<section class="grid" style="position:absolute;left:${g.side}px;right:${g.side}px;top:${g.top}px;bottom:${g.bottom}px;display:grid;grid-template-columns:repeat(${g.cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr));gap:${g.gapY}px ${g.gapX}px">`;
  vis.forEach((o,k)=>{s+=cardHTML(o.c,o.i,k,g.cols)});
  return s+'</section>';
}
function layerHTML(L,k){
  const base=`position:absolute;left:${L.x}px;top:${L.y}px;width:${L.w}px;${L.type==='shape'?`height:${L.h}px;`:''}transform:rotate(${L.rot||0}deg);opacity:${L.opacity??1};`;
  let inner='';
  if(L.type==='text')inner=`<div class="ed" data-bind="layers.${k}.text" data-multi="1" spellcheck="false" style="font-size:${L.size}px;font-weight:${L.weight};color:${L.color};text-align:${L.align};line-height:${L.lh||1.1};letter-spacing:${L.ls||0}em;text-transform:${L.upper?'uppercase':'none'};white-space:pre-wrap;word-break:break-word">${esc(L.text)}</div>`;
  else if(L.type==='image')inner=`<img src="${src(L.src)}" alt="" draggable="false" style="width:100%;display:block;pointer-events:none;border-radius:${L.radius||0}px">`;
  else inner=`<div style="width:100%;height:100%;background:${L.fill};border-radius:${L.shape==='ellipse'?'50%':L.shape==='pill'?'999px':(L.radius||0)+'px'};border:${L.strokeW>0?L.strokeW+'px solid '+L.stroke:'none'}"></div>`;
  return `<div class="layer" data-layer="${L.id}" data-sel="layer:${L.id}" style="${base}">${inner}<i class="rh" data-html2canvas-ignore="true"></i></div>`;
}
const layersHTML=behind=>S.layers.map((L,k)=>L.hidden||!!L.behind!==behind?'':layerHTML(L,k)).join('');
function domeHTML(b,H,th,tw){
  const d=S.dome,T=S.theme; if(!d.show)return '';
  if(d.shape==='flat'){
    return d.dir==='up'?`<div class="dome" style="position:absolute;left:0;top:${b+d.top}px;width:${tw}px;height:${th}px;background:${T.dome}"></div>`
                       :`<div class="dome" style="position:absolute;left:0;top:-2px;width:${tw}px;height:${b+d.top+2}px;background:${T.dome}"></div>`;
  }
  const left=b+DW/2-d.rx, top=d.dir==='up'?b+d.top:b+d.top-2*d.ry;
  return `<div class="dome" style="position:absolute;left:${left}px;top:${top}px;width:${2*d.rx}px;height:${2*d.ry}px;border-radius:50%;background:${T.dome}"></div>`;
}
function renderPoster(){
  const b=bleedPx(),H=DH(),tw=DW+2*b,th=H+2*b;
  const P=$('#poster');
  P.style.cssText=`width:${tw}px;height:${th}px;background:${S.theme.bg};--ff:${fontStack()}`;
  let g='';
  if(guides){
    const safe=.5*DW/S.canvas.wIn;
    g=`<div class="guides" data-html2canvas-ignore="true" style="position:absolute;left:${b}px;top:${b}px;width:${DW}px;height:${H}px;outline:4px dashed rgba(229,72,77,.95);pointer-events:none;z-index:50"><div style="position:absolute;left:${safe}px;top:${safe}px;right:${safe}px;bottom:${safe}px;outline:4px dashed rgba(60,200,120,.9)"></div></div>`;
  }
  P.innerHTML=domeHTML(b,H,th,tw)+`<div id="content" style="position:absolute;left:${b}px;top:${b}px;width:${DW}px;height:${H}px">${layersHTML(true)}${headerHTML()}${gridHTML()}${layersHTML(false)}</div>`+g;
  fitView();placeLeaf();fitText();fitCards();applySel();updatePrintCSS();
}
/* put the red maple leaf on the apostrophe of the drawn logo */
function placeLeaf(){
  const o=$('#poster .oval'),a=$('#poster .apos'),t=$('#poster .lt'),l=$('#poster .leaf');if(!o||!a||!l||!t)return;
  const w=S.header.logoW,fs=w*.28;
  const or=o.getBoundingClientRect(),ar=a.getBoundingClientRect(),tr=t.getBoundingClientRect(),sc=view.s||1;
  const cx=(ar.left+ar.width/2-or.left)/sc, top=(tr.top-or.top)/sc;
  l.style.left=(cx-w*.0425)+'px';l.style.top=(top+fs*.04)+'px';
}
/* shrink any header text that would overflow the poster (display only – your sizes stay as set) */
function fitText(){
  const max=DW-2*S.grid.side;
  $$('#poster .fit').forEach(el=>{
    const base=parseFloat(el.style.fontSize);let s=base;el.style.fontSize=base+'px';
    let n=0;while(el.scrollWidth>max+1&&s>20&&n++<80){s*=.97;el.style.fontSize=s+'px'}
  });
}
/* optional: shrink card text so it always fits inside its card (display only) */
function fitCards(){
  if(!S.grid.autoShrink)return;
  $$('#poster .card').forEach(card=>{
    const txt=$('.txt',card),icn=$('.icn',card),h=$('h3',card),p=$('p',card);if(!txt)return;
    const cs=getComputedStyle(card),pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),gap=parseFloat(cs.rowGap)||0;
    const stack=S.grid.layout==='stack',avail=card.clientHeight-pad-(cs.borderBottomWidth?parseFloat(cs.borderBottomWidth)*2:0);
    const need=()=>txt.offsetHeight+(stack&&icn?icn.offsetHeight+gap:0);
    let f=1,n=0;const h0=parseFloat(h.style.fontSize),p0=parseFloat(p.style.fontSize);
    while(need()>avail&&f>.45&&n++<40){f*=.96;h.style.fontSize=h0*f+'px';p.style.fontSize=p0*f+'px'}
  });
}
function fitView(){
  const b=bleedPx(),tw=DW+2*b,th=DH()+2*b,W=$('#work'),pad=40;
  let s=view.zoom==='fit'?Math.min((W.clientWidth-pad*2)/tw,(W.clientHeight-pad*2)/th):view.zoom;
  s=clamp(s||.1,.05,3);view.s=s;
  const wrap=$('#stageWrap');wrap.style.width=tw*s+'px';wrap.style.height=th*s+'px';wrap.style.margin=pad+'px auto';
  $('#stage').style.cssText=`width:${tw}px;height:${th}px;transform:scale(${s});transform-origin:0 0`;
  $('#zoomLbl').textContent=Math.round(s*100)+'%';
}
function updatePrintCSS(){
  const b=bleedPx(),tw=DW+2*b,wIn=S.canvas.wIn+2*S.canvas.bleed,hIn=S.canvas.hIn+2*S.canvas.bleed,k=wIn*96/tw;
  $('#printCSS').textContent=`@page{size:${wIn}in ${hIn}in;margin:0}@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}#app{display:block!important;height:auto!important}#top,#side,#toast,#exporting{display:none!important}#work{overflow:visible!important;background:none!important;height:auto!important}#stageWrap{width:${wIn}in!important;height:${hIn}in!important;margin:0!important;box-shadow:none!important}#stage{transform:scale(${k})!important}#poster .is-sel{outline:none!important}#poster .ed{box-shadow:none!important}.rh,.guides{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}`;
}
function applySel(){
  $$('#poster .is-sel').forEach(e=>e.classList.remove('is-sel'));
  if(!sel)return;
  let el=null;
  if(sel.t==='card')el=$(`#poster [data-sel="card:${sel.i}"]`);
  else if(sel.t==='header')el=$('#poster .hdr');
  else if(sel.t==='layer')el=$(`#poster .layer[data-layer="${sel.id}"]`);
  if(el)el.classList.add('is-sel');
}

function autoFit(k,old,oldRatio){
  if(!S.canvas.autoFit)return;
  const prev=oldRatio!==undefined?oldRatio:(k==='canvas.hIn'?old/S.canvas.wIn:S.canvas.hIn/old);
  const now=S.canvas.hIn/S.canvas.wIn;if(!prev||!isFinite(prev)||prev===now)return;
  const f=now/prev;
  S.dome.top=Math.round(S.dome.top*f);S.grid.top=Math.round(S.grid.top*f);
  S.grid.bottom=Math.round(S.grid.bottom*f);
}

function readURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function fileToAsset(f){
  let url=await readURL(f);
  if(f.type!=='image/svg+xml'){
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=2800;
    if(Math.max(im.naturalWidth,im.naturalHeight)>max){
      const k=max/Math.max(im.naturalWidth,im.naturalHeight),c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      url=c.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.92);
    }
  }
  const id=uid();ASSETS[id]=url;return 'asset:'+id;
}

window.addEventListener('pointerup',()=>{
  if(!drag)return;const L=S.layers.find(l=>l.id===drag.id);drag=null;
  if(L){['x','y','w','h'].forEach(p=>$$(`#panel [data-k="layers.${S.layers.indexOf(L)}.${p}"]`).forEach(o=>o.value=L[p]));commitSoon();saveSoon()}
});
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey,typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(typing||!sel||sel.t!=='layer')return;
  const L=S.layers.find(l=>l.id===sel.id);if(!L)return;
  const st=e.shiftKey?10:1;let used=true;
  if(e.key==='ArrowLeft')L.x-=st;else if(e.key==='ArrowRight')L.x+=st;else if(e.key==='ArrowUp')L.y-=st;else if(e.key==='ArrowDown')L.y+=st;
  else if(e.key==='Delete'||e.key==='Backspace'){S.layers=S.layers.filter(l=>l.id!==L.id);sel=null;renderSidebar()}
  else used=false;
  if(used){e.preventDefault();change()}
});
window.addEventListener('resize',()=>{fitView();placeLeaf()});
if(window.ResizeObserver)new ResizeObserver(()=>{if(view.zoom==='fit'){fitView();placeLeaf()}}).observe($('#work'));
document.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey)||!e.target.closest('#work'))return;e.preventDefault();view.zoom=clamp((view.s||1)*(e.deltaY<0?1.1:1/1.1),.05,3);fitView();placeLeaf()},{passive:false});

/* =====================================================================
   PNG EXPORT  (renders an off-screen, un-scaled copy so the result is exact)
   ===================================================================== */
async function exportPNG(){
  if(!window.html2canvas){toast('PNG engine still loading – try again in a second');return}
  const ov=$('#exporting');ov.classList.add('on');
  await new Promise(r=>setTimeout(r,60));
  const b=bleedPx(),tw=DW+2*b,th=DH()+2*b;
  const wIn=S.canvas.wIn+2*S.canvas.bleed;
  let outW=parseInt(($('#outW')||{}).value)||Math.round(wIn*150);outW=clamp(outW,300,9000);
  const host=document.createElement('div');
  host.style.cssText=`position:fixed;left:0;top:0;width:${tw}px;height:${th}px;z-index:-1;pointer-events:none`;
  const clone=poster.cloneNode(true);
  clone.removeAttribute('id');clone.style.cssText=poster.style.cssText+`;position:absolute;left:0;top:0;width:${tw}px;height:${th}px`;
  $$('.is-sel',clone).forEach(x=>x.classList.remove('is-sel'));
  $$('.guides,.rh',clone).forEach(x=>x.remove());
  $$('.ed',clone).forEach(x=>{x.removeAttribute('contenteditable');x.style.boxShadow='none'});
  host.appendChild(clone);document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(clone,{scale:outW/tw,backgroundColor:null,useCORS:true,logging:false,width:tw,height:th,windowWidth:tw,windowHeight:th,scrollX:0,scrollY:0});
    await new Promise(res=>cv.toBlob(bl=>{dl(bl,`${slug()}-${cv.width}x${cv.height}.png`);res()},'image/png'));
    toast(`PNG saved (${cv.width} × ${cv.height} px)`);
  }catch(err){console.error(err);toast('Export failed – try a smaller output width')}
  finally{host.remove();ov.classList.remove('on')}
}

/* =====================================================================
   BOOT
   ===================================================================== */
load();
commit();
fullRender();
$('#saved').textContent='Saved';
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderPoster()});
window.__studio={get S(){return S},get sel(){return sel},exportPNG,undo,redo,commit};
})();
